<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSENSI DESA JATISARI</title>
    <style>
        *{font-family:Arial,sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body{background:#fff; padding:5px;}
        h1{text-align:center; font-size:17px; font-weight:bold; margin-bottom:2px;}
        h2{text-align:center; font-size:13px; margin-bottom:6px; font-weight:normal;}
        .pilih-bulan{text-align:center; margin-bottom:6px;}
        select{padding:4px 8px; font-size:13px;}
        .tombol{text-align:center; margin:8px 0;}
        button{padding:6px 12px; margin:3px; font-size:12px; cursor:pointer;}
        table{border-collapse:collapse; width:100%; table-layout:fixed;}
        th,td{border:1px solid #000; padding:9px 2px; text-align:center; vertical-align:middle; font-size:12.5px;}
        th{background:#f0f0f0; font-weight:bold;}
        td:nth-child(2){text-align:left; padding-left:6px;}
        th:nth-child(1),td:nth-child(1){width:3.5%;}
        th:nth-child(2){width:16%;}
        th:nth-child(3){width:11%;}
        .merah{color:red; background:#ffebee; font-weight:bold;}
        .hadir{color:green; font-weight:bold;}
        .terlambat{color:red; font-weight:bold;}
        .ttd{border:none; margin-top:20px; width:100%;}
        .ttd td{border:none; text-align:right; padding-right:15px; font-size:12px; line-height:2;}
        @media print{.tombol,.pilih-bulan{display:none;} @page{size:215mm 330mm landscape; margin:0.4cm;}}
    </style>
</head>
<body>
    <h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
    <h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>
    <div class="pilih-bulan">
        Bulan: <select id="bln" onchange="buat()">
            <option value="9/2026">SEPTEMBER 2026</option>
            <option value="8/2026">AGUSTUS 2026</option>
        </select>
    </div>
    <div class="tombol">
        <button onclick="cetak()">🖨️ CETAK</button>
    </div>
    <table id="tabel"></table>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari"
});
const db=firebase.database().ref("dataAbsen");

const DAFTAR=[
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI KA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const LIBUR={"2026-8-26":true};
let dataAbsen={}, thn=2026, bln=9;

function jumlahTgl(b,t){return new Date(t,b,0).getDate();}
function cekMinggu(t,b,th){return new Date(th,b-1,t).getDay()===0;}
function cekLibur(t,b,th){
    const kunci=`${th}-${b}-${t}`;
    if(LIBUR[kunci]) return true;
    return cekMinggu(t,b,th);
}

function buat(){
    const v=document.getElementById("bln").value.split("/");
    bln=parseInt(v[0]); thn=parseInt(v[1]);
    const jml=jumlahTgl(bln,thn);
    const hurufMinggu=["M","I","N","G","G","U"];

    let html=`
    <thead>
        <tr><th rowspan="2">NO</th><th rowspan="2">NAMA</th><th rowspan="2">JABATAN</th>${Array.from({length:jml},()=>`<th></th>`).join("")}</tr>
        <tr><th colspan="${jml}" style="font-size:13px; letter-spacing:4px;">TANGGAL</th></tr>
        <tr>${Array.from({length:jml},(_,i)=>{
            const t=i+1; return cekLibur(t,bln,thn)?`<th class="merah">${t}</th>`:`<th>${t}</th>`;
        }).join("")}</tr>
    </thead><tbody>`;

    DAFTAR.forEach((orang,idx)=>{
        let urutHuruf=0;
        html+=`<tr><td>${idx+1}</td><td>${orang.nama}</td><td>${orang.jabatan}</td>`;
        for(let t=1;t<=jml;t++){
            if(cekMinggu(t,bln,thn)){
                html+=`<td class="merah">${urutHuruf<6?hurufMinggu[urutHuruf]:""}</td>`;
                urutHuruf++;
            }else if(cekLibur(t,bln,thn)){
                html+=`<td class="merah"></td>`;
            }else{
                const d=dataAbsen[`${orang.nama}-${t}`];
                html+=`<td>${d?(d.ket==="Hadir"?`<span class="hadir">${d.jam}</span>`:d.ket==="Terlambat"?`<span class="terlambat">${d.jam}</span>`:d.ket[0]):""}</td>`;
            }
        }
        html+=`</tr>`;
    });

    html+=`</tbody>`;
    html+=`<tfoot><tr><td colspan="${3+jml}" style="border:none; text-align:right; padding-right:15px; padding-top:20px;">
        Desa Jatisari, ............ ${thn}<br><br>
        KEPALA DESA JATISARI<br><br><br><br>
        MUHAMAD HASYIM
    </td></tr></tfoot>`;

    document.getElementById("tabel").innerHTML=html;
}

db.on("value",snap=>{
    const semua=snap.val()||{};
    for(let k in semua){
        const d=semua[k];
        if(!d.tgl) continue;
        const [hr,b,th]=d.tgl.split("/");
        if(parseInt(b)===bln&&parseInt(th)===thn) dataAbsen[`${d.nama}-${hr}`]=d;
    }
    buat();
});

function cetak(){window.print();}
buat();
</script>
</body>
</html>
