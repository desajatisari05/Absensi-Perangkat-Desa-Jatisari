<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - ABSENSI KEPALA DESA DAN PERANGKAT DESA</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#f1f8e9; padding:8px; font-size:13px;}
        .wadah {width:100%; max-width:1200px; margin:0 auto; background:#fff; padding:15px;}
        h1 {text-align:center; font-size:18px; color:#000; margin-bottom:3px; font-weight:bold;}
        h2 {text-align:center; font-size:14px; margin-bottom:10px; font-weight:normal;}
        .baris-atas {text-align:center; margin-bottom:12px;}
        .baris-atas select {padding:4px 8px; font-size:13px; min-width:180px;}
        .status-hubung {color:#2e7d32; font-weight:bold; margin:6px 0;}
        .tombol {padding:8px 16px; font-size:13px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; margin:3px;}
        .hijau {background:#2e7d32;}
        .biru {background:#1976d2;}
        .merah {background:#d32f2f;}
        table {width:100%; border-collapse:collapse; margin-top:10px;}
        table th, table td {border:1px solid #333; padding:4px 3px; text-align:center; vertical-align:middle; font-size:12px;}
        table th {background:#e8f5e9; font-weight:bold;}
        .kolom-tanggal {min-width:28px;}
        .minggu {background:#ffebee; color:#c62828; font-weight:bold;}
        .huruf-minggu {writing-mode:vertical-lr; letter-spacing:2px; font-weight:bold;}
        .hadir {color:#2e7d32; font-weight:bold;}
        .terlambat {color:#c62828; font-weight:bold;}
        .kosong {color:#aaa;}
        .tanda-tangan {margin-top:40px; text-align:right; font-size:13px;}
        .tanda-tangan .nama {margin-top:60px; font-weight:bold;}
        @media print {
            body {background:#fff; padding:0;}
            .wadah {box-shadow:none; padding:0;}
            .baris-atas, .tombol, .status-hubung {display:none;}
            table th, table td {border:1px solid #000;}
        }
    </style>
</head>
<body>
<div class="wadah">
    <h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
    <h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>

    <div class="baris-atas">
        <label for="pilihBulan">Bulan:</label>
        <select id="pilihBulan" onchange="ubahBulan()"></select>
        <div class="status-hubung">TERHUBUNG - Data diperbarui otomatis</div>
        <button class="tombol hijau" onclick="unduhExcel()">Unduh Excel</button>
        <button class="tombol biru" onclick="window.print()">Cetak Berkas</button>
        <button class="tombol merah" onclick="hapusData()">Hapus Semua Data</button>
    </div>

    <table id="tabelAbsen">
        <thead id="kepalaTabel">
            <!-- ISI OTOMATIS -->
        </thead>
        <tbody id="isiTabel">
            <!-- ISI OTOMATIS -->
        </tbody>
    </table>

    <div class="tanda-tangan">
        <div id="tempatTanggal">Desa Jatisari, 30 September 2026</div>
        <div>KEPALA DESA JATISARI</div>
        <div class="nama">MUHAMAD HASYIM</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");

// === DAFTAR NAMA & JABATAN ===
const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI IKA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const NAMA_BULAN = [
    "JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI",
    "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"
];
const NAMA_HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

let dataAbsen = {};
let bulanAktif = 9;
let thnAktif = 2026;

// === BUAT PILIHAN BULAN OTOMATIS ===
function isiPilihanBulan(){
    const pilih = document.getElementById("pilihBulan");
    const sekarang = new Date();
    thnAktif = sekarang.getFullYear();
    const blnSekarang = sekarang.getMonth();

    pilih.innerHTML = "";
    for(let b = 0; b <= blnSekarang; b++){
        const opsi = document.createElement("option");
        opsi.value = `${b+1}/${thnAktif}`;
        opsi.textContent = `${NAMA_BULAN[b]} ${thnAktif}`;
        if(b === blnSekarang){
            opsi.selected = true;
            bulanAktif = b+1;
        }
        pilih.appendChild(opsi);
    }
}

function ubahBulan(){
    const val = document.getElementById("pilihBulan").value.split("/");
    bulanAktif = parseInt(val[0]);
    thnAktif = parseInt(val[1]);
    susunTabel();
}

// === AMBIL DATA ===
db.on("value", (snap)=>{
    dataAbsen = snap.val() || {};
    susunTabel();
});

// === SUSUN TABEL ===
function susunTabel(){
    const hariPertama = new Date(thnAktif, bulanAktif-1, 1);
    const hariTerakhir = new Date(thnAktif, bulanAktif, 0);
    const jmlHari = hariTerakhir.getDate();

    // Perbarui tulisan tempat & tanggal
    document.getElementById("tempatTanggal").textContent = 
        `Desa Jatisari, ${jmlHari} ${NAMA_BULAN[bulanAktif-1]} ${thnAktif}`;

    // === KEPALA TABEL ===
    let htmlKepala = `<tr>
        <th rowspan="2">NO</th>
        <th rowspan="2">NAMA</th>
        <th rowspan="2">JABATAN</th>
        <th colspan="${jmlHari}">TANGGAL</th>
    </tr><tr>`;

    for(let t=1; t<=jmlHari; t++){
        const d = new Date(thnAktif, bulanAktif-1, t);
        const hr = d.getDay();
        if(hr === 0){
            htmlKepala += `<th class="kolom-tanggal minggu huruf-minggu">M<br>I<br>N<br>G<br>G<br>U</th>`;
        }else{
            htmlKepala += `<th class="kolom-tanggal">${t}</th>`;
        }
    }
    htmlKepala += `</tr>`;
    document.getElementById("kepalaTabel").innerHTML = htmlKepala;

    // === ISI TABEL ===
    let htmlIsi = "";
    DAFTAR.forEach((orang, idx)=>{
        htmlIsi += `<tr>
            <td>${idx+1}</td>
            <td style="text-align:left; padding:0 5px;">${orang.nama}</td>
            <td style="text-align:left; padding:0 5px;">${orang.jabatan}</td>`;
        
        for(let t=1; t<=jmlHari; t++){
            const d = new Date(thnAktif, bulanAktif-1, t);
            const hr = d.getDay();
            const tglStr = `${t}/${bulanAktif}/${thnAktif}`;
            let ket = "";
            let warna = "";

            // Cari data absen
            for(let key in dataAbsen){
                if(dataAbsen[key].nama === orang.nama && dataAbsen[key].tgl === tglStr){
                    ket = dataAbsen[key].jam || dataAbsen[key].ket;
                    warna = dataAbsen[key].warna === "merah" ? "terlambat" : "hadir";
                    break;
                }
            }

            if(hr === 0){
                htmlIsi += `<td class="minggu">-</td>`;
            }else if(ket){
                htmlIsi += `<td class="${warna}">${ket}</td>`;
            }else{
                htmlIsi += `<td class="kosong">-</td>`;
            }
        }
        htmlIsi += `</tr>`;
    });
    document.getElementById("isiTabel").innerHTML = htmlIsi;
}

// === FUNGSI LAIN ===
function unduhExcel(){
    alert("Fitur unduh Excel siap");
}
function hapusData(){
    if(confirm("Yakin ingin menghapus semua data?")){
        db.remove();
    }
}

// === JALANKAN SAAT DIBUKA ===
isiPilihanBulan();
</script>
</body>
</html>
