<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - ABSENSI KEPALA DESA DAN PERANGKAT DESA</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#f1f8e9; padding:8px; font-size:13px;}
        .wadah {width:100%; max-width:1200px; margin:0 auto; background:#fff; padding:5px;}
        h1 {text-align:center; font-size:17px; color:#000; margin-bottom:2px; font-weight:bold;}
        h2 {text-align:center; font-size:13px; margin-bottom:8px; font-weight:normal;}
        .atas {text-align:center; margin-bottom:8px;}
        .atas select {padding:3px 6px; font-size:13px;}
        .status {color:#2e7d32; font-size:12px; margin:4px 0;}
        .btn {padding:6px 12px; font-size:13px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; margin:2px;}
        .hijau {background:#4caf50;}
        .biru {background:#2196f3;}
        .merah {background:#f44336;}
        table {width:100%; border-collapse:collapse; margin-top:5px;}
        th, td {border:1px solid #ccc; padding:2px 3px; text-align:center; font-size:12px;}
        th {background:#f0f0f0; font-weight:bold;}
        .minggu {background:#ffebee; color:#c62828; font-weight:bold;}
        .huruf-minggu {writing-mode:vertical-lr; letter-spacing:2px;}
        .ttd {margin-top:30px; text-align:right; font-size:13px;}
        .ttd .nama {margin-top:50px; font-weight:bold;}
        @media print {
            body {background:#fff;}
            .atas, .btn, .status {display:none;}
        }
    </style>
</head>
<body>
<div class="wadah">
    <h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
    <h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>

    <div class="atas">
        Bulan:
        <select id="pilihBulan" onchange="ubahBulan()"></select>
        <div class="status">☐ TERHUBUNG - Data diperbarui otomatis</div>
        <button class="btn hijau" onclick="unduhExcel()">☐ Unduh Excel</button>
        <button class="btn biru" onclick="window.print()">CETAK BERKAS</button>
        <button class="btn merah" onclick="hapusData()">Hapus Semua Data</button>
    </div>

    <table>
        <thead id="kepala"></thead>
        <tbody id="isi"></tbody>
    </table>

    <div class="ttd">
        <div id="tglBawah">Desa Jatisari, 30 SEPTEMBER 2026</div>
        <div>KEPALA DESA JATISARI</div>
        <br><br><br>
        <div>MUHAMAD HASYIM</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");

const NAMA_BULAN = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI IKA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const thnSekarang = new Date().getFullYear();
const blnSekarang = new Date().getMonth() + 1;
let blnAktif = blnSekarang;

// === HANYA BAGIAN INI YANG DITAMBAHKAN ===
function isiBulan(){
    const sel = document.getElementById("pilihBulan");
    sel.innerHTML = "";
    for(let b=1; b<=blnSekarang; b++){
        let opt = document.createElement("option");
        opt.value = b;
        opt.textContent = NAMA_BULAN[b-1] + " " + thnSekarang;
        if(b === blnSekarang) opt.selected = true;
        sel.appendChild(opt);
    }
}

function ubahBulan(){
    blnAktif = parseInt(document.getElementById("pilihBulan").value);
    susunTabel();
}

let data = {};
db.on("value", s => { data = s.val() || {}; susunTabel(); });

function susunTabel(){
    const akhir = new Date(thnSekarang, blnAktif, 0).getDate();
    document.getElementById("tglBawah").textContent = 
        "Desa Jatisari, " + akhir + " " + NAMA_BULAN[blnAktif-1] + " " + thnSekarang;

    let kep = `<tr>
        <th rowspan="2">NO</th>
        <th rowspan="2">NAMA</th>
        <th rowspan="2">JABATAN</th>
        <th colspan="${akhir}">TANGGAL</th>
    </tr><tr>`;
    for(let t=1; t<=akhir; t++){
        const d = new Date(thnSekarang, blnAktif-1, t);
        if(d.getDay() === 0){
            kep += `<th class="minggu huruf-minggu">M<br>I<br>N<br>G<br>G<br>U</th>`;
        }else{
            kep += `<th>${t}</th>`;
        }
    }
    kep += `</tr>`;
    document.getElementById("kepala").innerHTML = kep;

    let isi = "";
    DAFTAR.forEach((org, i)=>{
        isi += `<tr>
            <td>${i+1}</td>
            <td style="text-align:left;">${org.nama}</td>
            <td style="text-align:left;">${org.jabatan}</td>`;
        for(let t=1; t<=akhir; t++){
            const d = new Date(thnSekarang, blnAktif-1, t);
            if(d.getDay() === 0){
                isi += `<td class="minggu"></td>`;
                continue;
            }
            const kunci = `${t}/${blnAktif}/${thnSekarang}`;
            let ket = "";
            for(let k in data){
                if(data[k].nama === org.nama && data[k].tgl === kunci){
                    ket = data[k].jam || data[k].ket || "";
                    break;
                }
            }
            isi += `<td>${ket}</td>`;
        }
        isi += `</tr>`;
    });
    document.getElementById("isi").innerHTML = isi;
}

function unduhExcel(){ alert("Fitur Unduh Excel"); }
function hapusData(){ if(confirm("Yakin hapus semua data?")) db.remove(); }

isiBulan();
susunTabel();
</script>
</body>
</html>
