<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - ABSENSI KEPALA DESA DAN PERANGKAT DESA</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#f1f8e9; padding:8px; font-size:13px;}
        .wadah {width:100%; max-width:1200px; margin:0 auto; background:#fff; padding:5px;}
        h1 {text-align:center; font-size:17px; color:#000; margin-bottom:2px; font-weight:bold;}
        h2 {text-align:center; font-size:13px; margin-bottom:8px; font-weight:normal;}
        .baris-atas {text-align:center; margin-bottom:8px;}
        .baris-atas select {padding:3px 6px; font-size:13px;}
        .status-hubung {color:#2e7d32; font-size:12px; margin:4px 0;}
        .tombol {padding:7px 14px; font-size:13px; border:none; border-radius:4px; color:#fff; font-weight:bold; cursor:pointer; margin:2px;}
        .hijau {background:#2e7d32;}
        .biru {background:#1976d2;}
        .merah {background:#d32f2f;}
        table {width:100%; border-collapse:collapse; margin-top:5px;}
        table th, table td {border:1px solid #333; padding:3px 2px; text-align:center; font-size:12px;}
        table th {background:#e8f5e9; font-weight:bold;}
        .minggu {background:#ffebee; color:#c62828; font-weight:bold;}
        .huruf-minggu {writing-mode:vertical-lr; letter-spacing:2px;}
        .hadir {color:#2e7d32; font-weight:bold;}
        .terlambat {color:#c62828; font-weight:bold;}
        .kosong {color:#aaa;}
        .tanda-tangan {margin-top:30px; text-align:right; font-size:13px;}
        .tanda-tangan .nama {margin-top:50px; font-weight:bold;}
        @media print {
            body {background:#fff;}
            .baris-atas, .tombol, .status-hubung {display:none;}
        }
    </style>
</head>
<body>
<div class="wadah">
    <h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
    <h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>

    <div class="baris-atas">
        Bulan:
        <select id="pilihBulan" onchange="ubahBulan()"></select>
        <div class="status-hubung">☐ TERHUBUNG - Data diperbarui otomatis</div>
        <button class="tombol hijau" onclick="unduhExcel()">☐ Unduh Excel</button>
        <button class="tombol biru" onclick="window.print()">CETAK BERKAS</button>
        <button class="tombol merah" onclick="hapusData()">Hapus Semua Data</button>
    </div>

    <table>
        <thead id="kepalaTabel"></thead>
        <tbody id="isiTabel"></tbody>
    </table>

    <div class="tanda-tangan">
        <div id="tglBawah">Desa Jatisari, 30 SEPTEMBER 2026</div>
        <div>KEPALA DESA JATISARI</div>
        <div class="nama">MUHAMAD HASYIM</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");

const NAMA_BULAN = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI IKA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const thnSekarang = new Date().getFullYear();
const blnSekarang = new Date().getMonth() + 1;
let blnAktif = blnSekarang;

// === PILIHAN BULAN OTOMATIS ===
function isiPilihanBulan(){
    const pilih = document.getElementById("pilihBulan");
    pilih.innerHTML = "";
    for(let b=1; b<=blnSekarang; b++){
        const opsi = document.createElement("option");
        opsi.value = b;
        opsi.textContent = NAMA_BULAN[b-1] + " " + thnSekarang;
        if(b === blnSekarang) opsi.selected = true;
        pilih.appendChild(opsi);
    }
}

function ubahBulan(){
    blnAktif = parseInt(document.getElementById("pilihBulan").value);
    susunTabel();
}

let dataAbsen = {};
db.on("value", (snap)=>{
    dataAbsen = snap.val() || {};
    susunTabel();
});

function susunTabel(){
    const hariTerakhir = new Date(thnSekarang, blnAktif, 0).getDate();
    document.getElementById("tglBawah").textContent = 
        "Desa Jatisari, " + hariTerakhir + " " + NAMA_BULAN[blnAktif-1] + " " + thnSekarang;

    // === KEPALA TABEL — PERSIS FOTO PERTAMA ===
    let kepala = `<tr>
        <th rowspan="2">NO</th>
        <th rowspan="2">NAMA</th>
        <th rowspan="2">JABATAN</th>
        <th colspan="${hariTerakhir}">TANGGAL</th>
    </tr><tr>`;
    
    for(let t=1; t<=hariTerakhir; t++){
        const d = new Date(thnSekarang, blnAktif-1, t);
        if(d.getDay() === 0){
            kepala += `<th class="minggu huruf-minggu">M<br>I<br>N<br>G<br>G<br>U</th>`;
        }else{
            kepala += `<th>${t}</th>`;
        }
    }
    kepala += `</tr>`;
    document.getElementById("kepalaTabel").innerHTML = kepala;

    // === ISI TABEL ===
    let isi = "";
    DAFTAR.forEach((orang, idx)=>{
        isi += `<tr>
            <td>${idx+1}</td>
            <td style="text-align:left; padding:0 4px;">${orang.nama}</td>
            <td style="text-align:left; padding:0 4px;">${orang.jabatan}</td>`;
        for(let t=1; t<=hariTerakhir; t++){
            const d = new Date(thnSekarang, blnAktif-1, t);
            if(d.getDay() === 0){
                isi += `<td class="minggu"></td>`;
                continue;
            }
            const tglStr = `${t}/${blnAktif}/${thnSekarang}`;
            let ket = "";
            let kelas = "kosong";
            for(let key in dataAbsen){
                if(dataAbsen[key].nama === orang.nama && dataAbsen[key].tgl === tglStr){
                    ket = dataAbsen[key].jam || dataAbsen[key].ket;
                    kelas = dataAbsen[key].warna === "merah" ? "terlambat" : "hadir";
                    break;
                }
            }
            isi += `<td class="${kelas}">${ket || ""}</td>`;
        }
        isi += `</tr>`;
    });
    document.getElementById("isiTabel").innerHTML = isi;
}

function unduhExcel(){ alert("Fitur Unduh Excel"); }
function hapusData(){ if(confirm("Yakin hapus semua data?")) db.remove(); }

isiPilihanBulan();
susunTabel();
</script>
</body>
</html>
