<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</title>
<style>
*{font-family:Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
body{background:#fff; padding:10px; font-size:13px;}

.bagian-atas{text-align:center; margin-bottom:10px;}
.bagian-atas h1{font-size:16px; font-weight:bold; margin-bottom:3px;}
.bagian-atas h2{font-size:13px; margin-bottom:8px; font-weight:normal;}
.baris-kontrol{text-align:center; margin:8px 0;}
.baris-kontrol label{margin-right:4px;}
.baris-kontrol select{padding:3px 6px; font-size:13px; margin:0 4px;}
.baris-kontrol .status{font-size:12px; color:#333; margin-left:8px;}
.tombol-group{text-align:center; margin:10px 0;}
.tombol-group button{padding:6px 12px; margin:0 3px; font-size:12px; cursor:pointer; border:none; border-radius:3px; color:#fff; font-weight:bold;}
.btn-excel{background:#28a745;}
.btn-cetak{background:#007bff;}
.btn-hapus{background:#dc3545;}

table{border-collapse:collapse; width:100%; table-layout:fixed; margin-top:5px;}
th, td{border:1px solid #ccc; padding:5px 2px; text-align:center; vertical-align:middle; font-size:12px;}
th{background:#f0f0f0; font-weight:bold;}
td:nth-child(2){text-align:left; padding-left:8px;}
th:nth-child(1), td:nth-child(1){width:4%;}
th:nth-child(2), td:nth-child(2){width:18%;}
th:nth-child(3), td:nth-child(3){width:13%;}
.merah{color:red; font-weight:bold;}
.hadir{color:green; font-weight:bold;}
.terlambat{color:red; font-weight:bold;}
.latar-merah{background:#ffe6e6;}

.tanda-tangan{width:100%; margin-top:20px; text-align:right; padding-right:15px; font-size:12px; line-height:1.7;}

@media print{
    .baris-kontrol, .tombol-group{display:none;}
    @page{size:A4 landscape; margin:0.8cm;}
}
</style>
</head>
<body>

<div class="bagian-atas">
<h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
<h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>
<div class="baris-kontrol">
<label>Bulan:</label>
<select id="bln" onchange="buatTabel()">
<option value="9/2026">SEPTEMBER 2026</option>
<option value="8/2026">AGUSTUS 2026</option>
<option value="7/2026">JULI 2026</option>
</select>
<span class="status">☑ TERHUBUNG - Data diperbarui otomatis</span>
</div>
<div class="tombol-group">
<button class="btn-excel">☐ Unduh Excel</button>
<button class="btn-cetak" onclick="window.print()">☐ CETAK BERKAS</button>
<button class="btn-hapus">☐ Hapus Semua Data</button>
</div>
</div>

<table id="tabel"></table>
<div class="tanda-tangan" id="ttd"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari"
});
const db = firebase.database().ref("dataAbsen");

// === URUTAN NAMA PERSIS SEPERTI DI GAMBAR ===
const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI KA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const LIBUR = {"2026-8-26":true};
// === HURUF M-I-N-G-G-U BERULANG SETIAP HARI MINGGU ===
const HURUF_MINGGU = ["M","I","N","G","G","U","M","I","N","G","G","U"];
let dataAbsen = {};
let thnSkr, blnSkr;

function jumlahTanggal(bulan, tahun){
    return new Date(tahun, bulan, 0).getDate();
}
function apakahMinggu(tgl, bulan, tahun){
    return new Date(tahun, bulan-1, tgl).getDay() === 0;
}
function apakahLibur(tgl, bulan, tahun){
    const kunci = tahun + "-" + bulan + "-" + tgl;
    if(LIBUR[kunci]) return true;
    return apakahMinggu(tgl, bulan, tahun);
}

function buatTabel(){
    const bagian = document.getElementById("bln").value.split("/");
    blnSkr = parseInt(bagian[0]);
    thnSkr = parseInt(bagian[1]);
    const jmlTgl = jumlahTanggal(blnSkr, thnSkr);

    let html = "<thead>";
    // Baris angka tanggal
    html += "<tr>";
    html += "<th>NO</th><th>NAMA</th><th>JABATAN</th>";
    for(let t=1; t<=jmlTgl; t++){
        html += apakahLibur(t, blnSkr, thnSkr)
            ? "<th class='merah'>" + t + "</th>"
            : "<th>" + t + "</th>";
    }
    html += "</tr></thead><tbody>";

    // Isi tabel — huruf Minggu sesuai urutan baris
    DAFTAR.forEach((orang, idx)=>{
        html += "<tr>";
        html += "<td>" + (idx+1) + "</td>";
        html += "<td>" + orang.nama + "</td>";
        html += "<td>" + orang.jabatan + "</td>";

        for(let t=1; t<=jmlTgl; t++){
            if(apakahMinggu(t, blnSkr, thnSkr)){
                html += "<td class='merah latar-merah'>" + HURUF_MINGGU[idx] + "</td>";
            }else if(apakahLibur(t, blnSkr, thnSkr)){
                html += "<td class='merah latar-merah'></td>";
            }else{
                const d = dataAbsen[orang.nama + "-" + t];
                if(d){
                    if(d.ket === "Hadir") html += "<td class='hadir'>" + d.jam + "</td>";
                    else if(d.ket === "Terlambat") html += "<td class='terlambat'>" + d.jam + "</td>";
                    else html += "<td>" + d.ket.substring(0,1) + "</td>";
                }else{
                    html += "<td></td>";
                }
            }
        }
        html += "</tr>";
    });

    html += "</tbody>";
    document.getElementById("tabel").innerHTML = html;

    // Tanda tangan di kanan bawah
    document.getElementById("ttd").innerHTML =
        "Desa Jatisari, ............ " + thnSkr + "<br>" +
        "KEPALA DESA JATISARI<br><br>" +
        "MUHAMAD HASYIM";
}

db.on("value", snap=>{
    const semua = snap.val() || {};
    dataAbsen = {};
    for(let k in semua){
        const d = semua[k];
        if(!d.tgl) continue;
        const [hr,b,th] = d.tgl.split("/");
        if(parseInt(b) === blnSkr && parseInt(th) === thnSkr){
            dataAbsen[d.nama + "-" + hr] = d;
        }
    }
    buatTabel();
});

buatTabel();
</script>
</body>
</html>
