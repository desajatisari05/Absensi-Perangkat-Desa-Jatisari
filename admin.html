<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</title>
<style>
*{font-family:Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
body{background:#fff; padding:10px; font-size:13px;}
h1{text-align:center; font-size:16px; font-weight:bold; margin-bottom:3px;}
h2{text-align:center; font-size:13px; margin-bottom:8px; font-weight:normal;}
.pilih-bulan{text-align:center; margin-bottom:10px;}
select{padding:3px 6px; font-size:13px;}
.tombol{text-align:center; margin:8px 0;}
button{padding:5px 10px; margin:2px; font-size:12px; cursor:pointer;}
table{border-collapse:collapse; width:100%; table-layout:fixed; margin-top:5px;}
th, td{border:1px solid #000; padding:5px 2px; text-align:center; vertical-align:middle; font-size:12px;}
th{background:#f9f9f9; font-weight:bold;}
td:nth-child(2){text-align:left; padding-left:8px;}
th:nth-child(1), td:nth-child(1){width:4%;}
th:nth-child(2), td:nth-child(2){width:18%;}
th:nth-child(3), td:nth-child(3){width:13%;}
.merah{color:red; font-weight:bold;}
.hadir{color:green; font-weight:bold;}
.terlambat{color:red; font-weight:bold;}
.ttd-wrapper{width:100%; margin-top:20px; text-align:right; padding-right:15px; font-size:12px; line-height:1.7;}
.garis-ttd{border-bottom:1px solid #000; width:230px; margin-left:auto; margin-top:8px; margin-bottom:5px;}
@media print{
    .pilih-bulan, .tombol{display:none;}
    @page{size:A4 landscape; margin:0.8cm;}
}
</style>
</head>
<body>

<h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
<h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>

<div class="pilih-bulan">
Bulan: <select id="bln" onchange="buatTabel()">
<option value="9/2026">SEPTEMBER 2026</option>
<option value="8/2026">AGUSTUS 2026</option>
<option value="7/2026">JULI 2026</option>
</select>
</div>

<div class="tombol">
<button onclick="window.print()">🖨️ CETAK</button>
</div>

<table id="tabel"></table>
<div class="ttd-wrapper" id="tandaTangan"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari"
});
const db = firebase.database().ref("dataAbsen");

const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI KA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const LIBUR = {"2026-8-26":true};
let dataAbsen = {};
let thnSkr, blnSkr;

function jumlahTanggal(bulan, tahun){
    return new Date(tahun, bulan, 0).getDate();
}
function apakahMinggu(tgl, bulan, tahun){
    return new Date(tahun, bulan-1, tgl).getDay() === 0;
}
function apakahLibur(tgl, bulan, tahun){
    const kunci = tahun + "-" + bulan + "-" + tgl;
    if(LIBUR[kunci]) return true;
    return apakahMinggu(tgl, bulan, tahun);
}

function buatTabel(){
    const bagian = document.getElementById("bln").value.split("/");
    blnSkr = parseInt(bagian[0]);
    thnSkr = parseInt(bagian[1]);
    const jmlTgl = jumlahTanggal(blnSkr, thnSkr);
    const hurufMinggu = ["M","I","N","G","G","U"];

    let html = "<thead>";
    html += "<tr>";
    html += "<th rowspan='2'>NO</th>";
    html += "<th rowspan='2'>NAMA</th>";
    html += "<th rowspan='2'>JABATAN</th>";
    for(let t=1; t<=jmlTgl; t++) html += "<th></th>";
    html += "</tr>";

    // Baris TANGGAL menyilang
    html += "<tr><th colspan='" + jmlTgl + "' style='font-size:14px; letter-spacing:6px;'>TANGGAL</th></tr>";

    // Baris angka tanggal
    html += "<tr>";
    for(let t=1; t<=jmlTgl; t++){
        if(apakahLibur(t, blnSkr, thnSkr)){
            html += "<th class='merah'>" + t + "</th>";
        }else{
            html += "<th>" + t + "</th>";
        }
    }
    html += "</tr></thead><tbody>";

    // Isi tabel — M-I-N-G-G-U berurutan ke bawah
    DAFTAR.forEach((orang, idx)=>{
        let urutHuruf = idx; // langsung pakai nomor urut baris sebagai urutan huruf Minggu
        html += "<tr>";
        html += "<td>" + (idx+1) + "</td>";
        html += "<td>" + orang.nama + "</td>";
        html += "<td>" + orang.jabatan + "</td>";

        for(let t=1; t<=jmlTgl; t++){
            if(apakahMinggu(t, blnSkr, thnSkr)){
                if(urutHuruf >= 0 && urutHuruf < 6){
                    html += "<td class='merah'>" + hurufMinggu[urutHuruf] + "</td>";
                }else{
                    html += "<td></td>";
                }
            }else if(apakahLibur(t, blnSkr, thnSkr)){
                html += "<td class='merah'></td>";
            }else{
                const kunci = orang.nama + "-" + t;
                const d = dataAbsen[kunci];
                if(d){
                    if(d.ket === "Hadir") html += "<td class='hadir'>" + d.jam + "</td>";
                    else if(d.ket === "Terlambat") html += "<td class='terlambat'>" + d.jam + "</td>";
                    else html += "<td>" + d.ket.substring(0,1) + "</td>";
                }else{
                    html += "<td></td>";
                }
            }
        }
        html += "</tr>";
    });

    html += "</tbody>";
    document.getElementById("tabel").innerHTML = html;

    // Tanda tangan TERSEPARAT di bawah kanan
    document.getElementById("tandaTangan").innerHTML =
        "Desa Jatisari, ............ " + thnSkr + "<br>" +
        "KEPALA DESA JATISARI<br>" +
        "<div class='garis-ttd'></div>" +
        "MUHAMAD HASYIM";
}

db.on("value", function(snap){
    const semua = snap.val() || {};
    dataAbsen = {};
    for(let k in semua){
        const d = semua[k];
        if(!d.tgl) continue;
        const bagianTgl = d.tgl.split("/");
        const hr = parseInt(bagianTgl[0]);
        const b = parseInt(bagianTgl[1]);
        const th = parseInt(bagianTgl[2]);
        if(b === blnSkr && th === thnSkr){
            dataAbsen[d.nama + "-" + hr] = d;
        }
    }
    buatTabel();
});

buatTabel();
</script>
</body>
</html>
