<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - ABSENSI KEPALA DESA DAN PERANGKAT DESA</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#f1f8e9; padding:15px; font-size:13px;}
        .wadah {max-width:1200px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        h1 {text-align:center; font-size:18px; color:#2e7d32; margin-bottom:5px;}
        h2 {text-align:center; font-size:14px; color:#333; margin-bottom:15px; font-weight:normal;}
        .pilih-bulan {text-align:center; margin-bottom:15px;}
        select {padding:6px 12px; font-size:14px; border-radius:4px; border:1px solid #ccc;}
        .status {text-align:center; margin-bottom:10px; color:#2e7d32; font-weight:bold;}
        .tombol {text-align:center; margin:15px 0;}
        button {padding:8px 16px; margin:3px; font-size:13px; border:none; border-radius:4px; cursor:pointer; font-weight:bold;}
        .btn-excel {background:#4CAF50; color:#fff;}
        .btn-cetak {background:#2196F3; color:#fff;}
        .btn-hapus {background:#f44336; color:#fff;}
        button:hover {opacity:0.9;}
        table {border-collapse:collapse; width:100%; margin-top:10px;}
        th, td {border:1px solid #333; padding:4px 3px; text-align:center; vertical-align:middle; font-size:12px;}
        th {background:#c8e6c9; font-weight:bold;}
        td:nth-child(2) {text-align:left; padding-left:6px;}
        .tgl-merah {color:#c62828; font-weight:bold; background:#ffebee;}
        .hari-merah {color:#c62828; font-weight:bold; background:#ffebee;}
        .hadir {color:green; font-weight:bold;}
        .terlambat {color:red; font-weight:bold;}
        .kosong {background:#fff;}
        @media print {
            .tombol, .pilih-bulan, .status {display:none;}
            body {background:#fff;}
            .wadah {box-shadow:none; padding:0;}
            @page {size:215mm 330mm landscape; margin:0.8cm;}
        }
    </style>
</head>
<body>
<div class="wadah">
    <h1>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h1>
    <h2>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>

    <div class="pilih-bulan">
        <label>Bulan: </label>
        <select id="pilihBulan" onchange="ubahBulan()">
            <option value="SEPTEMBER 2026">SEPTEMBER 2026</option>
            <option value="AGUSTUS 2026">AGUSTUS 2026</option>
            <option value="JULI 2026">JULI 2026</option>
        </select>
    </div>

    <div class="status" id="statusHubung">🔌 TERHUBUNG - Data diperbarui otomatis</div>

    <div class="tombol">
        <button class="btn-excel" onclick="unduhExcel()">📋 Unduh Excel</button>
        <button class="btn-cetak" onclick="cetakBerkas()">🖨️ CETAK BERKAS</button>
        <button class="btn-hapus" onclick="hapusSemuaData()">🗑️ Hapus Semua Data</button>
    </div>

    <table id="tabelAbsen">
        <thead id="bagianKepala"></thead>
        <tbody id="bagianIsi"></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");

// === DAFTAR PERANGKAT DESA ===
const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI KA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

// === DAFTAR LIBUR NASIONAL ===
const DAFTAR_LIBUR = {
    "2026-01-01":"Tahun Baru Masehi",
    "2026-01-29":"Tahun Baru Imlek",
    "2026-03-29":"Hari Raya Nyepi",
    "2026-04-03":"Wafat Isa Almasih",
    "2026-05-01":"Hari Buruh",
    "2026-05-14":"Kenaikan Isa Almasih",
    "2026-06-25":"Idul Adha",
    "2026-07-06":"Tahun Baru Islam",
    "2026-08-17":"Hari Kemerdekaan",
    "2026-08-26":"Maulid Nabi Muhammad SAW",
    "2026-12-24":"Natal"
};

let dataAbsen = {};
let bulanTerpilih = "SEPTEMBER 2026";
let thn = 2026, bln = 8;

// === UBAH BULAN ===
function ubahBulan(){
    bulanTerpilih = document.getElementById("pilihBulan").value;
    const bagian = bulanTerpilih.split(" ");
    thn = parseInt(bagian[1]);
    bln = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"].indexOf(bagian[0]) + 1;
    buatTabel();
    ambilData();
}

// === AMBIL JUMLAH TANGGAL ===
function jumlahTanggal(b,t){
    return new Date(t,b,0).getDate();
}

// === AMBIL HARI DARI TANGGAL ===
function hariDariTanggal(tg,bl,th){
    const hari = ["M","S","S","R","K","J","S"];
    return hari[new Date(th,bl-1,tg).getDay()];
}

// === CEK APAKAH TANGGAL MERAH ===
function cekApakahMerah(tg,bl,th){
    const kunci = `${th}-${String(bl).padStart(2,"0")}-${String(tg).padStart(2,"0")}`;
    if(DAFTAR_LIBUR[kunci]) return true;
    const hariMinggu = new Date(th,bl-1,tg).getDay();
    if(hariMinggu === 0) return true;
    return false;
}

// === BUAT TABEL ===
function buatTabel(){
    const jmlTgl = jumlahTanggal(bln,thn);
    const kepala = document.getElementById("bagianKepala");
    const isi = document.getElementById("bagianIsi");

    let barisTgl = "<tr><th rowspan='2'>NO</th><th rowspan='2'>NAMA</th><th rowspan='2'>JABATAN</th>";
    let barisHari = "<tr>";

    for(let t=1; t<=jmlTgl; t++){
        const merah = cekApakahMerah(t,bln,thn);
        if(merah){
            barisTgl += `<th class="tgl-merah">${t}</th>`;
        } else {
            barisTgl += `<th>${t}</th>`;
        }
    }
    barisTgl += "</tr>";

    for(let t=1; t<=jmlTgl; t++){
        const hari = hariDariTanggal(t,bln,thn);
        const merah = cekApakahMerah(t,bln,thn);
        if(merah){
            barisHari += `<th class="hari-merah">${hari}</th>`;
        } else {
            barisHari += `<th>${hari}</th>`;
        }
    }
    barisHari += "</tr>";

    kepala.innerHTML = barisTgl + barisHari;

    let barisIsi = "";
    DAFTAR.forEach((orang, idx)=>{
        barisIsi += `<tr><td>${idx+1}</td><td>${orang.nama}</td><td>${orang.jabatan}</td>`;
        for(let t=1; t<=jmlTgl; t++){
            const merah = cekApakahMerah(t,bln,thn);
            if(merah){
                barisIsi += `<td class="hari-merah"></td>`;
            } else {
                barisIsi += `<td id="sel-${idx}-${t}" class="kosong"></td>`;
            }
        }
        barisIsi += "</tr>";
    });
    isi.innerHTML = barisIsi;
}

// === AMBIL DATA DARI FIREBASE ===
function ambilData(){
    dataAbsen = {};
    db.orderByChild("waktu").on("value", (snap)=>{
        const semua = snap.val() || {};
        for(let key in semua){
            const d = semua[key];
            if(!d.tgl) continue;
            const [hr,bl,thnAbsen] = d.tgl.split("/");
            if(parseInt(bl) === bln && parseInt(thnAbsen) === thn){
                dataAbsen[`${d.nama}-${hr}`] = d;
            }
        }
        isiKeTabel();
        document.getElementById("statusHubung").innerHTML = "✅ TERHUBUNG - Data diperbarui otomatis";
    }, (err)=>{
        document.getElementById("statusHubung").innerHTML = "❌ TIDAK TERHUBUNG: " + err.message;
    });
}

// === ISI DATA KE TABEL ===
function isiKeTabel(){
    const jmlTgl = jumlahTanggal(bln,thn);
    DAFTAR.forEach((orang, idx)=>{
        for(let t=1; t<=jmlTgl; t++){
            const sel = document.getElementById(`sel-${idx}-${t}`);
            if(!sel) continue;
            const kunci = `${orang.nama}-${t}`;
            const d = dataAbsen[kunci];
            if(d){
                if(d.ket === "Hadir"){
                    sel.innerHTML = `<span class="hadir">${d.jam}</span>`;
                } else if(d.ket === "Terlambat"){
                    sel.innerHTML = `<span class="terlambat">${d.jam}</span>`;
                } else if(d.ket === "Sakit"){
                    sel.innerHTML = "S";
                } else if(d.ket === "Izin"){
                    sel.innerHTML = "I";
                } else {
                    sel.innerHTML = d.ket.substring(0,1);
                }
            } else {
                sel.innerHTML = "";
            }
        }
    });
}

// === UNDUH EXCEL ===
function unduhExcel(){
    const jmlTgl = jumlahTanggal(bln,thn);
    let csv = "ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI\r\n";
    csv += "KECAMATAN TEMPEH KABUPATEN LUMAJANG\r\n";
    csv += `Bulan: ${bulanTerpilih}\r\n\r\n`;
    csv += "NO\tNAMA\tJABATAN";
    for(let t=1; t<=jmlTgl; t++) csv += "\t" + t;
    csv += "\r\n";

    const hari = ["M","S","S","R","K","J","S"];
    csv += "\t\t";
    for(let t=1; t<=jmlTgl; t++){
        csv += "\t" + hariDariTanggal(t,bln,thn);
    }
    csv += "\r\n";

    DAFTAR.forEach((orang, idx)=>{
        csv += `${idx+1}\t${orang.nama}\t${orang.jabatan}`;
        for(let t=1; t<=jmlTgl; t++){
            const merah = cekApakahMerah(t,bln,thn);
            if(merah){
                csv += "\tLIBUR";
            } else {
                const kunci = `${orang.nama}-${t}`;
                const d = dataAbsen[kunci];
                if(d){
                    if(d.ket === "Hadir" || d.ket === "Terlambat") csv += "\t" + d.jam;
                    else csv += "\t" + d.ket.substring(0,1);
                } else {
                    csv += "\t";
                }
            }
        }
        csv += "\r\n";
    });

    const namaFile = `Absen_Desa_Jatisari_${bulanTerpilih.replace(" ","_")}.xls`;
    const blob = new Blob(["\ufeff"+csv], {type:"application/vnd.ms-excel"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = namaFile;
    a.click();
    URL.revokeObjectURL(a.href);
}

// === CETAK BERKAS ===
function cetakBerkas(){
    const jmlTgl = jumlahTanggal(bln,thn);
    const halaman = window.open("", "_blank", "width=1200,height=800");
    halaman.document.write(`
    <html>
    <head>
        <title>Absensi Desa Jatisari - ${bulanTerpilih}</title>
        <style>
            *{font-family:Arial,sans-serif;}
            body{padding:12px; font-size:11px;}
            h2{text-align:center; font-size:16px; font-weight:bold; margin-bottom:5px;}
            h3{text-align:center; font-size:13px; font-weight:normal; margin-bottom:10px;}
            table{border-collapse:collapse; width:100%;}
            th,td{border:1px solid #000; padding:3px 2px; text-align:center; vertical-align:middle; font-size:10px;}
            th{background:#f0f0f0;}
            td:nth-child(2){text-align:left; padding-left:4px;}
            .tgl-merah{color:red; font-weight:bold; background:#ffebee;}
            .hari-merah{color:red; font-weight:bold; background:#ffebee;}
            .hadir{color:green; font-weight:bold;}
            .terlambat{color:red; font-weight:bold;}
            .ttd{border:none; margin-top:25px;}
            .ttd td{border:none; width:33%; text-align:center; padding-top:40px;}
            .btn{padding:10px 20px; font-size:14px; cursor:pointer; margin:15px auto; display:block;}
            @page {size:215mm 330mm landscape; margin:0.7cm;}
            @media print{.btn{display:none;}}
        </style>
    </head>
    <body>
        <h2>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI</h2>
        <h3>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h3>
        <h3>Bulan: ${bulanTerpilih}</h3>
        <table>
            <thead>
                <tr><th rowspan="2">NO</th><th rowspan="2">NAMA</th><th rowspan="2">JABATAN</th>${Array.from({length:jmlTgl},(_,i)=>{
                    const t=i+1; const merah=cekApakahMerah(t,bln,thn);
                    return merah?`<th class="tgl-merah">${t}</th>`:`<th>${t}</th>`;
                }).join("")}</tr>
                <tr>${Array.from({length:jmlTgl},(_,i)=>{
                    const t=i+1; const h=hariDariTanggal(t,bln,thn); const merah=cekApakahMerah(t,bln,thn);
                    return merah?`<th class="hari-merah">${h}</th>`:`<th>${h}</th>`;
                }).join("")}</tr>
            </thead>
            <tbody>
                ${DAFTAR.map((orang,idx)=>`<tr><td>${idx+1}</td><td>${orang.nama}</td><td>${orang.jabatan}</td>${
                    Array.from({length:jmlTgl},(_,i)=>{
                        const t=i+1; const merah=cekApakahMerah(t,bln,thn);
                        if(merah) return `<td class="hari-merah"></td>`;
                        const kunci = `${orang.nama}-${t}`;
                        const d=dataAbsen[kunci];
                        if(d){
                            if(d.ket==="Hadir") return `<td class="hadir">${d.jam}</td>`;
                            if(d.ket==="Terlambat") return `<td class="terlambat">${d.jam}</td>`;
                            return `<td>${(d.ket||"").substring(0,1)}</td>`;
                        }
                        return `<td></td>`;
                    }).join("")
                }</tr>`).join("")}
            </tbody>
        </table>
        <table class="ttd">
            <tr><td>Mengetahui,<br><br><br><br><br>.................................</td><td></td><td>Desa Jatisari, ............ ${thn}<br><br><br><br><br>.................................</td></tr>
        </table>
        <button class="btn" onclick="window.print()">🖨️ KLIK DISINI UNTUK MENCETAK</button>
    </body>
    </html>
    `);
    halaman.document.close();
}

// === HAPUS SEMUA DATA ===
function hapusSemuaData(){
    if(confirm("⚠️ YAKIN INGIN MENGHAPUS SEMUA DATA ABSEN BULAN INI?\nData yang sudah dihapus TIDAK BISA DIKEMBALIKAN!")){
        db.once("value").then((snap)=>{
            const semua = snap.val() || {};
            const hapus = [];
            for(let key in semua){
                const d = semua[key];
                if(!d.tgl) continue;
                const [hr,bl,thnAbsen] = d.tgl.split("/");
                if(parseInt(bl) === bln && parseInt(thnAbsen) === thn){
                    hapus.push(key);
                }
            }
            let janji = Promise.resolve();
            hapus.forEach(k=> janji = janji.then(()=> db.child(k).remove()));
            janji.then(()=> alert("✅ SEMUA DATA BULAN INI BERHASIL DIHAPUS!"))
                 .catch(e=> alert("❌ GAGAL: "+e.message));
        });
    }
}

// === MULAI ===
ubahBulan();
</script>
</body>
</html>
