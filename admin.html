<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN ABSENSI - TABEL BULANAN</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#f0f4f8; padding:15px; font-size:13px;}
        .wadah {max-width:100%; margin:0 auto; background:#fff; border-radius:8px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.1); overflow-x:auto;}
        h2 {color:#000; text-align:center; margin-bottom:5px; font-size:16px; font-weight:bold; line-height:1.4;}
        .bulan-pilih {text-align:center; margin-bottom:15px;}
        .bulan-pilih select {padding:6px; font-size:14px; border-radius:4px; border:1px solid #ccc;}
        .status {padding:8px; border-radius:4px; font-weight:bold; text-align:center; margin-bottom:12px; font-size:14px;}
        .terhubung {color:green; background:#e8f5e9;}
        .putus {color:red; background:#ffebee;}
        table {border-collapse:collapse; width:100%; white-space:nowrap;}
        th, td {border:1px solid #000; padding:2px 2px; text-align:center; vertical-align:middle; height:32px;}
        th {background:#f5f5f5; color:#000; font-size:12px; font-weight:bold;}
        th.libur {background:#ffebee; color:#c62828; font-weight:bold;}
        td {font-size:13px;}
        .nama {text-align:left; white-space:nowrap; min-width:220px; font-weight:500; padding:3px 6px;}
        .no {width:35px;}
        .tg {width:38px;}
        .hadir {background:#e8f5e9; color:#2e7d32; font-weight:bold;}
        .terlambat {background:#fff3e0; color:#e65100; font-weight:bold;}
        .sakit {background:#f3e5f5; color:#7b1fa2; font-weight:bold;}
        .izin {background:#e3f2fd; color:#1565c0; font-weight:bold;}
        .kosong {color:#aaa;}
        .huruf-libur {color:#c62828; font-weight:bold; font-size:14px;}
        .tombol-bar {text-align:center; margin-bottom:12px;}
        button {padding:8px 16px; border:none; border-radius:4px; cursor:pointer; font-size:14px; margin:0 5px; font-weight:bold;}
        .btn-hijau {background:#2e7d32; color:#fff;}
        .btn-merah {background:#c62828; color:#fff;}
    </style>
</head>
<body>
<div class="wadah">
    <h2>ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI<br>KECAMATAN TEMPEH KABUPATEN LUMAJANG</h2>

    <div class="bulan-pilih">
        <label>Bulan: </label>
        <select id="pilihBulan" onchange="buatTabel()">
            <option value="1-2026">JANUARI 2026</option>
            <option value="2-2026">PEBRUARI 2026</option>
            <option value="3-2026">MARET 2026</option>
            <option value="4-2026">APRIL 2026</option>
            <option value="5-2026">MEI 2026</option>
            <option value="6-2026">JUNI 2026</option>
            <option value="7-2026">JULI 2026</option>
            <option value="8-2026" selected>AGUSTUS 2026</option>
            <option value="9-2026">SEPTEMBER 2026</option>
            <option value="10-2026">OKTOBER 2026</option>
            <option value="11-2026">NOVEMBER 2026</option>
            <option value="12-2026">DESEMBER 2026</option>
        </select>
    </div>

    <div id="statusKoneksi" class="status">Memeriksa koneksi...</div>

    <div class="tombol-bar">
        <button class="btn-hijau" onclick="unduhExcel()">📥 Unduh Excel</button>
        <button class="btn-merah" onclick="hapusSemua()">🗑️ Hapus Semua Data</button>
    </div>

    <div style="overflow-x:auto;">
        <table id="tabelUtuh">
            <thead id="kepalaTabel"></thead>
            <tbody id="isiTabel"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");
let dataMentah = [];

const DAFTAR_URUTAN = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasie Pemerintahan"},
    {nama:"NISFUL LAILI KA J.", jabatan:"Kasie Kesra"},
    {nama:"WIJI SAHRONI", jabatan:"Kasie Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

const TANGGAL_MERAH = {
    "1-1": true, "1-29": true, "2-16": true, "3-29": true, "4-3": true,
    "5-1": true, "5-14": true, "5-26": true, "6-1": true, "6-17": true,
    "7-6": true, "8-17": true, "9-24": true, "12-25": true
};

function jumlahHari(bulan, tahun){
    return new Date(tahun, bulan, 0).getDate();
}

function cekLibur(tgl, bln, thn){
    const hari = new Date(thn, bln-1, tgl).getDay();
    const kunci = bln + "-" + tgl;
    if(hari === 0) return {jenis:"minggu", libur:true, teks:"MINGGU"};
    if(TANGGAL_MERAH[kunci]) return {jenis:"merah", libur:true, teks:"LIBUR"};
    return {libur:false};
}

function buatTabel(){
    const val = document.getElementById("pilihBulan").value.split("-");
    const bln = parseInt(val[0]);
    const thn = parseInt(val[1]);
    const jmlHari = jumlahHari(bln, thn);

    let kepala = `<tr><th class="no">NO</th><th class="nama">NAMA</th><th class="nama">JABATAN</th>`;
    for(let t=1; t<=jmlHari; t++){
        const info = cekLibur(t, bln, thn);
        kepala += info.libur ? `<th class="tg libur">${t}</th>` : `<th class="tg">${t}</th>`;
    }
    kepala += `</tr>`;
    document.getElementById("kepalaTabel").innerHTML = kepala;

    let isi = "";
    DAFTAR_URUTAN.forEach((orang, urut) => {
        isi += `<tr><td>${urut+1}</td><td class="nama">${orang.nama}</td><td class="nama">${orang.jabatan}</td>`;
        for(let t=1; t<=jmlHari; t++){
            const info = cekLibur(t, bln, thn);
            if(info.libur){
                const huruf = info.teks.split("");
                isi += `<td class="huruf-libur">${huruf[urut] || ""}</td>`;
                continue;
            }
            const tglCari = t + "/" + bln + "/" + thn;
            const catatan = dataMentah.filter(d => d.nama === orang.nama && d.tgl === tglCari).sort((a,b)=>new Date(b.waktu)-new Date(a.waktu))[0];
            let tampil = "";
            let kelas = "kosong";
            if(catatan){
                tampil = catatan.jam.replace(".", ":");
                if(catatan.ket === "Hadir") kelas = "hadir";
                else if(catatan.ket === "Terlambat") kelas = "terlambat";
                else if(catatan.ket === "Sakit") {kelas = "sakit"; tampil = "sakit";}
                else if(catatan.ket === "Izin") {kelas = "izin"; tampil = "ijin";}
            }
            isi += `<td class="${kelas}">${tampil}</td>`;
        }
        isi += `</tr>`;
    });
    document.getElementById("isiTabel").innerHTML = isi;
}

db.on("value", (snap) => {
    const hasil = snap.val();
    dataMentah = hasil ? Object.values(hasil) : [];
    buatTabel();
    document.getElementById("statusKoneksi").innerText = "✅ TERHUBUNG - Data diperbarui otomatis";
    document.getElementById("statusKoneksi").className = "status terhubung";
}, (err) => {
    document.getElementById("statusKoneksi").innerText = "❌ PUTUS KONEKSI: " + err.message;
    document.getElementById("statusKoneksi").className = "status putus";
});

function unduhExcel(){
    const val = document.getElementById("pilihBulan").value.split("-");
    const bln = parseInt(val[0]);
    const thn = parseInt(val[1]);
    const jmlHari = jumlahHari(bln, thn);
    const namaBulan = ["","JANUARI","PEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"][bln];

    const barisJudul = ["ABSENSI KEPALA DESA DAN PERANGKAT DESA JATISARI — KECAMATAN TEMPEH KABUPATEN LUMAJANG"];
    const barisBulan = ["BULAN " + namaBulan + " TAHUN " + thn];
    const barisKosong = [""];
    const barisTabel = ["NO","NAMA","JABATAN"];
    for(let t=1; t<=jmlHari; t++) barisTabel.push(t);
    const dataExcel = [barisJudul, barisBulan, barisKosong, barisTabel];

    DAFTAR_URUTAN.forEach((orang, urut) => {
        const baris = [urut+1, orang.nama, orang.jabatan];
        for(let t=1; t<=jmlHari; t++){
            const info = cekLibur(t, bln, thn);
            if(info.libur){
                const huruf = info.teks.split("");
                baris.push(huruf[urut] || "");
                continue;
            }
            const tglCari = t + "/" + bln + "/" + thn;
            const catatan = dataMentah.filter(d => d.nama === orang.nama && d.tgl === tglCari).sort((a,b)=>new Date(b.waktu)-new Date(a.waktu))[0];
            baris.push(catatan ? (catatan.ket==="Sakit"?"sakit":catatan.ket==="Izin"?"ijin":catatan.jam.replace(".",":")) : "");
        }
        dataExcel.push(baris);
    });

    const buku = XLSX.utils.book_new();
    const lembar = XLSX.utils.aoa_to_sheet(dataExcel);
    XLSX.utils.book_append_sheet(buku, lembar, "ABSENSI");
    XLSX.writeFile(buku, `ABSENSI_DESA_JATISARI_${namaBulan}_${thn}.xlsx`);
}

function hapusSemua(){
    if(confirm("Yakin HAPUS SEMUA DATA ABSENSI?")){
        db.remove();
    }
}
</script>
</body>
</html>
