<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSENSI KADES & PERANGKAT DESA JATISARI</title>
    <style>
        * {font-family: Arial; margin: 0; padding: 0; box-sizing: border-box;}
        body {background: #f0f4f8; padding:20px;}
        .kotak {max-width:420px; margin:0 auto; background:#fff; border-radius:10px; padding:25px; box-shadow:0 3px 10px #0000001a; text-align:center;}
        h2 {color:#0d47a1; margin-bottom:25px; font-size:22px; line-height:1.3;}
        .input {width:100%; padding:14px; margin-bottom:12px; border:1px solid #bbb; border-radius:6px; font-size:16px;}
        .tombol {width:100%; padding:15px; background:#1565c0; color:white; border:none; border-radius:6px; font-size:17px; font-weight:bold; cursor:pointer; transition:0.3s;}
        .tombol.siap {background:#2e7d32;}
        .tombol:disabled {background:#ccc; cursor:not-allowed;}
        .pesan {margin-top:18px; padding:12px; border-radius:6px; font-weight:bold; display:block; min-height:40px;}
        .sukses {background:#e8f5e9; color:#2e7d32;}
        .gagal {background:#ffebee; color:#c62828;}
        .info-bawah {font-size:14px; color:#555; margin-top:20px; line-height:1.6;}
    </style>
</head>
<body>
<div class="kotak">
    <h2>ABSENSI KADES DAN PERANGKAT DESA JATISARI</h2>
    <input type="text" id="nama" class="input" placeholder="Masukkan Nama Lengkap">
    <input type="text" id="jabatan" class="input" placeholder="Masukkan Jabatan">
    <select id="pilih" class="input">
        <option value="Hadir">Hadir</option>
        <option value="Sakit">Sakit</option>
        <option value="Izin">Izin</option>
    </select>
    <button id="btnAbsen" class="tombol" onclick="prosesAbsen()">KLIK UNTUK ABSEN</button>
    <div id="pesan" class="pesan">Siap untuk absen...</div>
    <div class="info-bawah">
        Jam Absen: 07.30 - 12.00<br>
        ✅ WAJIB BUKA DI GOOGLE CHROME & AKTIFKAN GPS<br>
        Jln Kapten Jama'ari No.76, Tempeh Lumajang
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const KANTOR = {lat: -8.198, lng: 113.159167};
const RADIUS_METER = 300;

const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};

// Cek apakah browser bisa konek database
try {
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database().ref("dataAbsen");
} catch(e) {
    document.getElementById("pesan").className = "pesan gagal";
    document.getElementById("pesan").innerText = "❌ Browser tidak didukung! Pakai Google Chrome";
}

function hitungJarak(lat1,lng1,lat2,lng2){
    const R = 6371;
    let dLat = (lat2-lat1)*Math.PI/180;
    let dLng = (lng2-lng1)*Math.PI/180;
    let a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

document.getElementById("nama").addEventListener("input",cekSiap);
document.getElementById("jabatan").addEventListener("input",cekSiap);
function cekSiap(){
    const n = document.getElementById("nama").value.trim();
    const j = document.getElementById("jabatan").value.trim();
    const btn = document.getElementById("btnAbsen");
    if(n && j) btn.classList.add("siap");
    else btn.classList.remove("siap");
}

function prosesAbsen(){
    const pesan = document.getElementById("pesan");
    pesan.className = "pesan";
    pesan.innerText = "⌛ Sedang memproses... tunggu sebentar";

    const skrg = new Date();
    const menit = skrg.getHours()*60 + skrg.getMinutes();

    // Cek jam
    if(menit < 7*60+30 || menit > 12*60){
        pesan.className = "pesan gagal";
        pesan.innerText = "❌ Di luar jam absen! (07.30 - 12.00)";
        return;
    }

    // CEK APAKAH FITUR LOKASI ADA DI HP
    if (!navigator.geolocation) {
        pesan.className = "pesan gagal";
        pesan.innerText = "❌ HP tidak mendukung GPS/Lokasi!";
        return;
    }

    // Minta lokasi dengan pengaturan paling jelas & cepat
    navigator.geolocation.getCurrentPosition(
    // Jika BERHASIL dapat lokasi
    pos=>{
        pesan.innerText = "✅ Lokasi diterima... sedang kirim data";

        let jarak = hitungJarak(pos.coords.latitude, pos.coords.longitude, KANTOR.lat, KANTOR.lng);
        if(jarak > RADIUS_METER/1000){
            pesan.className = "pesan gagal";
            pesan.innerText = `❌ Di luar kantor! Jarak: ${Math.round(jarak*1000)}m`;
            return;
        }

        let ket = document.getElementById("pilih").value;
        if(ket === "Hadir"){
            ket = menit <= 8*60+30 ? "Hadir" : "Terlambat";
        }

        let nama = document.getElementById("nama").value.trim();
        let jabatan = document.getElementById("jabatan").value.trim();
        if(!nama || !jabatan){
            pesan.className = "pesan gagal";
            pesan.innerText = "❌ Nama & Jabatan harus diisi!";
            return;
        }

        let dataBaru = {
            nama:nama, jabatan:jabatan, ket:ket,
            tgl: skrg.toLocaleDateString('id-ID'),
            jam: skrg.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}),
            waktu: skrg.toISOString()
        };

        // Kirim ke database
        db.push(dataBaru)
        .then(()=>{
            pesan.className = "pesan sukses";
            pesan.innerText = "✅ BERHASIL TERKIRIM! Cek Admin sekarang";
            document.getElementById("btnAbsen").disabled = true;
        })
        .catch(err=>{
            pesan.className = "pesan gagal";
            pesan.innerText = "❌ Gagal kirim: "+err.message;
        });
    },
    // Jika DITOLAK / GAGAL dapat lokasi
    err=>{
        pesan.className = "pesan gagal";
        if(err.code === 1) {
            pesan.innerText = "❌ DITOLAK! Buka Pengaturan HP -> Izinkan Lokasi untuk Chrome";
        } else if(err.code === 2) {
            pesan.innerText = "❌ TIDAK DAPAT LOKASI! Nyalakan GPS & sinyal kuat";
        } else {
            pesan.innerText = "❌ Gagal ambil lokasi: "+err.message;
        }
    },
    // Pengaturan lokasi: akurat tinggi, tunggu maks 10 detik
    {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}
</script>
</body>
</html>
