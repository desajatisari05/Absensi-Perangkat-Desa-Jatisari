<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSENSI KEPALA DESA DAN PERANGKAT DESA</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#e8f5e9; padding:15px; font-size:14px;}
        .wadah {max-width:420px; margin:0 auto; background:#fff; border-radius:10px; padding:20px; box-shadow:0 3px 10px rgba(0,0,0,0.1);}
        h2 {color:#2e7d32; text-align:center; margin-bottom:0; font-size:32px; font-weight:normal; font-style:italic;}
        h3 {color:#2e7d32; text-align:center; margin-top:5px; margin-bottom:20px; font-size:26px; font-weight:normal; font-style:italic;}
        .alamat {text-align:center; margin-bottom:20px; font-size:15px; color:#333;}
        label {display:block; margin:12px 0 5px; font-weight:bold; color:#333;}
        select, input {width:100%; padding:10px; font-size:15px; border:1px solid #ccc; border-radius:5px;}
        .kode-kotak {background:#fff3e0; border:2px dashed #e65100; padding:15px; text-align:center; margin:15px 0; border-radius:8px; display:none;}
        .kode-label {font-size:13px; color:#e65100; font-weight:bold;}
        .kode-nilai {font-size:28px; font-weight:bold; color:#c62828; margin-top:5px; letter-spacing:5px;}
        button {width:100%; padding:12px; background:#2e7d32; color:#fff; border:none; border-radius:5px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:20px;}
        button:disabled {background:#ccc; cursor:not-allowed;}
        .pesan {margin-top:15px; padding:10px; border-radius:5px; text-align:center; font-weight:bold; display:none;}
        .sukses {background:#e8f5e9; color:#2e7d32; display:block;}
        .salah {background:#ffebee; color:#c62828; display:block;}
        .info-lokasi {font-size:12px; margin-top:10px; color:#555;}
    </style>
</head>
<body>
<div class="wadah">
    <h2>ABSENSI</h2>
    <h3>KEPALA DESA DAN PERANGKAT DESA</h3>
    <div class="alamat">Desa Jatisari  Kec. Tempeh Kab. Lumajang</div>

    <label>Nama Lengkap:</label>
    <select id="namaPilih" onchange="cekKhususKepala()"><option value="">-- Pilih Nama Anda --</option></select>

    <label>Jabatan:</label>
    <input type="text" id="jabatanTampil" readonly placeholder="Otomatis muncul">

    <label>Keterangan Absen:</label>
    <select id="keteranganPilih" onchange="cekKeteranganAbsen()">
        <option value="">-- Pilih Keterangan --</option>
        <option value="Hadir">✅ HADIR</option>
        <option value="Sakit">🏠 SAKIT</option>
        <option value="Izin">📝 IZIN</option>
    </select>

    <div class="kode-kotak" id="kotakKode">
        <div class="kode-label">✅ KODE ABSENSI ANDA:</div>
        <div class="kode-nilai" id="nilaiKode"></div>
        <div class="kode-label" style="font-size:11px; margin-top:5px;">Masukkan kode di bawah ini</div>
    </div>

    <label id="labelKode" style="display:none;">Masukkan Kode Absensi:</label>
    <input type="text" id="masukkanKode" placeholder="Masukkan kode yang muncul di atas" style="display:none;">

    <div class="info-lokasi" id="infoLokasi">🔍 Memeriksa lokasi...</div>

    <button id="tombolAbsen" onclick="kirimAbsen()">✅ KLIK DISINI UNTUK ABSEN</button>
    <div id="pesan" class="pesan"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");

// === DAFTAR KARYAWAN ===
const DAFTAR = [
    {nama:"MUHAMAD HASYIM", jabatan:"Kepala Desa"},
    {nama:"RUBIANTO", jabatan:"Sekretaris Desa"},
    {nama:"ETIK WAHYUNINGSIH", jabatan:"Kaur TU dan Umum"},
    {nama:"NURCHOIRIDA NIRWANAH", jabatan:"Kaur Keuangan"},
    {nama:"ZAINUL FITRIANDI", jabatan:"Kaur Perencanaan"},
    {nama:"IKA NURSASI", jabatan:"Kasi Pemerintahan"},
    {nama:"NISFUL LAILI KA J.", jabatan:"Kasi Kesra"},
    {nama:"WUI SAHRONI", jabatan:"Kasi Pelayanan"},
    {nama:"YUDI ARMINTO", jabatan:"Kasun Karang Tengah"},
    {nama:"NURSUADI", jabatan:"Kasun Cerme Wetan"},
    {nama:"ANDIK EKA SUDIAWANTO", jabatan:"Kasun Cerme Kulon"},
    {nama:"WAHYU HARI P.", jabatan:"Kasun Krajan"}
];

// === LOKASI KANTOR DESA JATISARI ===
const KANTOR_LAT = -8.196026;
const KANTOR_LNG = 113.1620121;
const RADIUS_METER = 100;

// === ATURAN JAM ABSENSI ===
const JAM_BUKA = 7;      // Mulai bisa absen: 07:20
const MENIT_BUKA = 20;
const JAM_TEPAT = 8;     // Batas tepat waktu: 08:30
const MENIT_TEPAT = 30;
const JAM_TUTUP = 12;    // Tutup absen: 12:00
const MENIT_TUTUP = 0;

// === ISI PILIHAN NAMA ===
const pilih = document.getElementById("namaPilih");
DAFTAR.forEach((orang)=>{
    let opsi = document.createElement("option");
    opsi.value = orang.nama;
    opsi.textContent = orang.nama;
    pilih.appendChild(opsi);
});

let lokasiValid = false;
let kodeSaatIni = "";
let lokasiDariKantor = 999999;

// === CEK LOKASI SAAT HALAMAN DIBUKA ===
if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(berhasilLokasi, gagalLokasi, {enableHighAccuracy:true, timeout:10000});
} else {
    document.getElementById("infoLokasi").innerHTML = "❌ Perangkat tidak mendukung lokasi";
}

function berhasilLokasi(posisi){
    const lat = posisi.coords.latitude;
    const lng = posisi.coords.longitude;
    lokasiDariKantor = hitungJarak(lat, lng, KANTOR_LAT, KANTOR_LNG);
    
    if(lokasiDariKantor <= RADIUS_METER){
        lokasiValid = true;
        buatKodeBaru();
        document.getElementById("infoLokasi").innerHTML = `✅ Di dalam kantor (${Math.round(lokasiDariKantor)} meter)`;
    } else {
        lokasiValid = false;
        kodeSaatIni = "";
        document.getElementById("infoLokasi").innerHTML = `⚠️ Di luar kantor (${Math.round(lokasiDariKantor)} meter dari kantor)`;
    }
    cekKeteranganAbsen();
}

function gagalLokasi(err){
    document.getElementById("infoLokasi").innerHTML = "⚠️ Tidak bisa membaca lokasi: " + err.message;
    lokasiValid = false;
    kodeSaatIni = "";
    sembunyikanKode();
}

function hitungJarak(lat1, lng1, lat2, lng2){
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// === BUAT KODE OTOMATIS ===
function buatKodeBaru(){
    const sekarang = new Date();
    const tgl = sekarang.getDate();
    const bln = sekarang.getMonth()+1;
    const thn = sekarang.getFullYear();
    const jam = sekarang.getHours();
    kodeSaatIni = (tgl*bln*jam*thn).toString(36).toUpperCase().substring(0,6);
}

function tampilkanKode(){
    document.getElementById("kotakKode").style.display = "block";
    document.getElementById("nilaiKode").textContent = kodeSaatIni;
    document.getElementById("labelKode").style.display = "block";
    document.getElementById("masukkanKode").style.display = "block";
}

function sembunyikanKode(){
    document.getElementById("kotakKode").style.display = "none";
    document.getElementById("labelKode").style.display = "none";
    document.getElementById("masukkanKode").style.display = "none";
}

// === CEK JENIS KETERANGAN ABSEN ===
function cekKeteranganAbsen(){
    const keterangan = document.getElementById("keteranganPilih").value;

    // Jika SAKIT atau IZIN → TANPA KODE & TANPA LOKASI
    if(keterangan === "Sakit" || keterangan === "Izin"){
        sembunyikanKode();
        document.getElementById("infoLokasi").innerHTML = "🏠 Bebas lokasi — Sakit/Izin";
        return;
    }

    // Jika HADIR → WAJIB LOKASI & KODE
    if(keterangan === "Hadir"){
        if(lokasiValid){
            tampilkanKode();
        } else {
            sembunyikanKode();
        }
    }
}

// === CEK KHUSUS KEPALA DESA ===
function cekKhususKepala(){
    const nama = document.getElementById("namaPilih").value;
    const orang = DAFTAR.find(o => o.nama === nama);
    if(orang){
        document.getElementById("jabatanTampil").value = orang.jabatan;
    } else {
        document.getElementById("jabatanTampil").value = "";
        return;
    }

    // KHUSUS KEPALA DESA: TANPA KODE & LOKASI
    if(nama === "MUHAMAD HASYIM" && orang.jabatan === "Kepala Desa"){
        document.getElementById("keteranganPilih").value = "Hadir";
        sembunyikanKode();
        document.getElementById("infoLokasi").innerHTML = "👑 KEPALA DESA — Bebas lokasi & tanpa kode";
    }
}

// === CEK JAM ABSEN & STATUS ===
function cekJamAbsen(){
    const sekarang = new Date();
    const jam = sekarang.getHours();
    const menit = sekarang.getMinutes();
    const totalMenit = jam * 60 + menit;

    const bukaMenit = JAM_BUKA * 60 + MENIT_BUKA;     // 07:20 = 440
    const tepatMenit = JAM_TEPAT * 60 + MENIT_TEPAT; // 08:30 = 510
    const tutupMenit = JAM_TUTUP * 60 + MENIT_TUTUP;  // 12:00 = 720

    if(totalMenit < bukaMenit || totalMenit >= tutupMenit){
        return {bisaAbsen: false, status: "DILUAR JAM"};
    } else if(totalMenit <= tepatMenit){
        return {bisaAbsen: true, status: "Hadir", warna: "hijau"};
    } else {
        return {bisaAbsen: true, status: "Terlambat", warna: "merah"};
    }
}

// === KIRIM ABSEN ===
function kirimAbsen(){
    const nama = document.getElementById("namaPilih").value;
    const jabatan = document.getElementById("jabatanTampil").value;
    let keterangan = document.getElementById("keteranganPilih").value;
    const kodeYangDimasukkan = document.getElementById("masukkanKode").value.trim().toUpperCase();
    const pesan = document.getElementById("pesan");

    if(!nama){
        pesan.textContent = "⚠️ Silakan pilih nama Anda dulu!";
        pesan.className = "pesan salah"; return;
    }
    if(!keterangan){
        pesan.textContent = "⚠️ Silakan pilih keterangan absen!";
        pesan.className = "pesan salah"; return;
    }

    // === ATURAN KHUSUS KEPALA DESA ===
    if(nama === "MUHAMAD HASYIM" && jabatan === "Kepala Desa"){
        const jamCek = cekJamAbsen();
        if(!jamCek.bisaAbsen){
            pesan.textContent = "❌ Belum masuk jam absen! Mulai jam 07:20";
            pesan.className = "pesan salah"; return;
        }
        simpanAbsen(nama, jabatan, jamCek.status, jamCek.warna);
        return;
    }

    // === SAKIT atau IZIN ===> Langsung absen tanpa syarat lokasi & kode & tanpa batas jam
    if(keterangan === "Sakit" || keterangan === "Izin"){
        simpanAbsen(nama, jabatan, keterangan, "-");
        return;
    }

    // === HADIR ===> CEK JAM, LOKASI & KODE
    if(keterangan === "Hadir"){
        const jamCek = cekJamAbsen();
        if(!jamCek.bisaAbsen){
            pesan.textContent = "❌ Belum masuk jam absen! Mulai jam 07:20 s/d 12:00";
            pesan.className = "pesan salah"; return;
        }
        if(!lokasiValid || kodeSaatIni === ""){
            pesan.textContent = "❌ Kode tidak muncul! Pastikan Anda berada di kantor!";
            pesan.className = "pesan salah"; return;
        }
        if(kodeYangDimasukkan !== kodeSaatIni){
            pesan.textContent = "❌ Kode yang dimasukkan SALAH!";
            pesan.className = "pesan salah"; return;
        }
        keterangan = jamCek.status;
        const warnaJam = jamCek.warna;
        simpanAbsen(nama, jabatan, keterangan, warnaJam);
        return;
    }
}

function simpanAbsen(nama, jabatan, keterangan, warna){
    const sekarang = new Date();
    const tgl = sekarang.getDate() + "/" + (sekarang.getMonth()+1) + "/" + sekarang.getFullYear();
    const jam = sekarang.getHours() + "." + String(sekarang.getMinutes()).padStart(2,"0");

    db.push({
        nama: nama,
        jabatan: jabatan,
        tgl: tgl,
        jam: jam,
        ket: keterangan,
        warna: warna,
        waktu: sekarang.toISOString()
    }).then(()=>{
        const pesan = document.getElementById("pesan");
        pesan.textContent = "✅ ABSEN BERHASIL! Terima kasih!";
        pesan.className = "pesan sukses";
        document.getElementById("masukkanKode").value = "";
        setTimeout(()=>{ pesan.style.display = "none"; }, 5000);
    }).catch((err)=>{
        const pesan = document.getElementById("pesan");
        pesan.textContent = "❌ Gagal: " + err.message;
        pesan.className = "pesan salah";
    });
}
</script>
</body>
</html>
