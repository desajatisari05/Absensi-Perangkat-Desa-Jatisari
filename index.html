<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSENSI PERANGKAT DESA JATISARI</title>
    <style>
        * {font-family: Arial, sans-serif; margin:0; padding:0; box-sizing:border-box;}
        body {background:#e8f5e9; padding:10px; font-size:14px;}
        .wadah {max-width:420px; margin:0 auto; background:#fff; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        h2 {text-align:center; font-size:18px; margin-bottom:15px; color:#2e7d32; font-weight:bold;}
        .info {background:#e8f5e9; padding:10px; border-radius:6px; margin-bottom:12px; font-size:14px; line-height:1.6;}
        .info span {font-weight:bold; color:#1b5e20;}
        .kode-harian {background:#fff9c4; padding:12px; border-radius:6px; margin:12px 0 8px 0; text-align:center; border:2px solid #fdd835; display:none;}
        .kode-harian .angka {font-size:28px; font-weight:bold; color:#e65100; letter-spacing:6px; margin-top:4px;}
        .terikat {background:#fff3cd; padding:10px; border-radius:6px; margin-bottom:12px; border-left:4px solid #ffc107;}
        label {display:block; margin:10px 0 5px 0; font-weight:bold; font-size:14px;}
        input, select, button {width:100%; padding:12px; font-size:15px; border-radius:6px; border:1px solid #ccc;}
        input {letter-spacing:3px; font-weight:bold; text-align:center; margin-bottom:4px;}
        button {background:#2e7d32; color:#fff; border:none; margin-top:8px; font-weight:bold; cursor:pointer;}
        button:disabled {background:#ccc; cursor:not-allowed;}
        .status {margin-top:12px; padding:12px; border-radius:6px; font-weight:bold; text-align:center; font-size:15px;}
        .berhasil {background:#c8e6c9; color:#256029;}
        .gagal {background:#ffcdd2; color:#c62828;}
    </style>
</head>
<body>
<div class="wadah">
    <h2>ABSENSI KERJA<br>DESA JATISARI</h2>
    <div class="info">
        Hari, Tanggal : <span id="tglSekarang"></span><br>
        Jam Sekarang : <span id="jamSekarang"></span><br>
        Lokasi : <span id="lokasi">Mendeteksi...</span>
    </div>

    <div id="infoTerikat" class="terikat" style="display:none;"></div>

    <select id="nama" onchange="isiJabatan(); cekTampilKode();">
        <option value="">-- Pilih Nama --</option>
        <option value="MUHAMAD HASYIM">MUHAMAD HASYIM</option>
        <option value="RUBIANTO">RUBIANTO</option>
        <option value="ETIK WAHYUNINGSIH">ETIK WAHYUNINGSIH</option>
        <option value="NURCHOIRIDA NIRWANAH">NURCHOIRIDA NIRWANAH</option>
        <option value="ZAINUL FITRIANDI">ZAINUL FITRIANDI</option>
        <option value="IKA NURSASI">IKA NURSASI</option>
        <option value="NISFUL LAILI IKA J.">NISFUL LAILI IKA J.</option>
        <option value="WIJI SAHRONI">WIJI SAHRONI</option>
        <option value="YUDI ARMINTO">YUDI ARMINTO</option>
        <option value="NURSUADI">NURSUADI</option>
        <option value="ANDIK EKA SUDIAWANTO">ANDIK EKA SUDIAWANTO</option>
        <option value="WAHYU HARI P.">WAHYU HARI P.</option>
    </select>

    <label for="jabatan">Jabatan:</label>
    <select id="jabatan" disabled>
        <option value="">-- Otomatis --</option>
    </select>

    <label for="keterangan">Keterangan Absen:</label>
    <select id="keterangan" onchange="cekTampilKode();">
        <option value="">-- Pilih Keterangan --</option>
        <option value="Hadir">Hadir</option>
        <option value="Sakit">Sakit</option>
        <option value="Izin">Izin</option>
    </select>

    <div class="kode-harian" id="kotakKode">
        🔑 KODE ABSEN HARI INI:<br>
        <div class="angka" id="tampilKode"></div>
    </div>

    <label for="kodeAbsen">Masukkan Kode di Atas:</label>
    <input type="text" id="kodeAbsen" placeholder="Ketik kode di sini" maxlength="4" autocomplete="off">

    <button id="btnAbsen" onclick="kirimAbsen()">KIRIM ABSEN</button>
    <div id="status" class="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Z8wXzrT8xWkL9rM7vNqPwQeRbTtYwU",
  authDomain: "absen-desa-jatisari.firebaseapp.com",
  databaseURL: "https://absen-desa-jatisari-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-desa-jatisari",
  storageBucket: "absen-desa-jatisari.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dataAbsen");

// === DAFTAR NAMA DAN JABATAN ===
const DAFTAR = {
    "MUHAMAD HASYIM": "Kepala Desa",
    "RUBIANTO": "Sekretaris Desa",
    "ETIK WAHYUNINGSIH": "Kaur TU dan Umum",
    "NURCHOIRIDA NIRWANAH": "Kaur Keuangan",
    "ZAINUL FITRIANDI": "Kaur Perencanaan",
    "IKA NURSASI": "Kasie Pemerintahan",
    "NISFUL LAILI IKA J.": "Kasie Kesra",
    "WIJI SAHRONI": "Kasie Pelayanan",
    "YUDI ARMINTO": "Kasun Karang Tengah",
    "NURSUADI": "Kasun Cerme Wetan",
    "ANDIK EKA SUDIAWANTO": "Kasun Cerme Kulon",
    "WAHYU HARI P.": "Kasun Krajan"
};

// === WAJIB LOKASI KANTOR JIKA PILIH HADIR ===
const WAJIB_KANTOR = [
    "RUBIANTO",
    "ETIK WAHYUNINGSIH",
    "NURCHOIRIDA NIRWANAH",
    "ZAINUL FITRIANDI",
    "IKA NURSASI",
    "NISFUL LAILI IKA J.",
    "WIJI SAHRONI"
];

// === KODE ABSEN BERUBAH OTOMATIS SETIAP HARI ===
function kodeHariIni(){
    const sekarang = new Date();
    const thn = sekarang.getFullYear();
    const bln = sekarang.getMonth() + 1;
    const tgl = sekarang.getDate();
    const kode = (tgl * 7 + bln * 13 + thn % 100) % 9000 + 1000;
    return String(kode);
}

// === TAMPILKAN KODE SETELAH PILIH NAMA & KETERANGAN ===
function cekTampilKode(){
    const nama = document.getElementById("nama").value;
    const ket = document.getElementById("keterangan").value;
    const kotakKode = document.getElementById("kotakKode");
    if(nama && ket){
        document.getElementById("tampilKode").textContent = kodeHariIni();
        kotakKode.style.display = "block";
    }else{
        kotakKode.style.display = "none";
    }
}

// === CEK HP SUDAH TERIKAT DENGAN NAMA SIAPA ===
const KUNCI_HP = "hp_terikat_nama";
let namaTerikat = localStorage.getItem(KUNCI_HP) || "";

// === TAMPILKAN INFORMASI JIKA SUDAH TERIKAT ===
function cekIkatanHP(){
    const info = document.getElementById("infoTerikat");
    const selNama = document.getElementById("nama");
    if(namaTerikat){
        info.style.display = "block";
        info.innerHTML = "🔒 HP ini terikat dengan: <strong>" + namaTerikat + "</strong><br>Tidak bisa ganti nama!";
        selNama.value = namaTerikat;
        selNama.disabled = true;
        isiJabatan();
    }
}

// === ISI JABATAN OTOMATIS ===
function isiJabatan(){
    const nama = document.getElementById("nama").value;
    const jabatan = document.getElementById("jabatan");
    jabatan.innerHTML = nama ? `<option value="${DAFTAR[nama]}">${DAFTAR[nama]}</option>` : `<option value="">-- Otomatis --</option>`;
}

// === TAMPILKAN TANGGAL DAN JAM ===
function tampilTanggal(){
    const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const sekarang = new Date();
    const tgl = sekarang.getDate();
    const bln = sekarang.getMonth()+1;
    const thn = sekarang.getFullYear();
    const jam = sekarang.toTimeString().substr(0,8);
    document.getElementById("tglSekarang").textContent = `${hari[sekarang.getDay()]}, ${tgl}/${bln}/${thn}`;
    document.getElementById("jamSekarang").textContent = jam;
}
setInterval(tampilTanggal, 1000);
tampilTanggal();

// === AMBIL LOKASI ===
let lokasiDiterima = false;
if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
        (pos)=>{
            document.getElementById("lokasi").textContent = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} — Diterima`;
            lokasiDiterima = true;
        },
        (err)=>{
            document.getElementById("lokasi").textContent = "Tidak didapatkan";
        }
    );
}

// === KIRIM ABSEN ===
function kirimAbsen(){
    const nama = document.getElementById("nama").value;
    const jabatan = DAFTAR[nama];
    const keterangan = document.getElementById("keterangan").value;
    const kodeDiisi = document.getElementById("kodeAbsen").value.trim();
    const kodeBenar = kodeHariIni();
    const sekarang = new Date();
    const jam = sekarang.toTimeString().substr(0,5);
    const tgl = `${sekarang.getDate()}/${sekarang.getMonth()+1}/${sekarang.getFullYear()}`;
    const jamMenit = sekarang.getHours()*60 + sekarang.getMinutes();

    // Cek waktu absen
    if(jamMenit < 7*60){
        tampilStatus("❌ Belum jam absen. Mulai jam 07.01", "gagal");
        return;
    }
    if(!nama){
        tampilStatus("❌ Silakan pilih nama dulu", "gagal");
        return;
    }
    if(!keterangan){
        tampilStatus("❌ Silakan pilih Keterangan Absen", "gagal");
        return;
    }
    // Cek kode absen
    if(!kodeDiisi){
        tampilStatus("❌ Silakan masukkan KODE ABSEN!", "gagal");
        return;
    }
    if(kodeDiisi !== kodeBenar){
        tampilStatus("❌ KODE ABSEN SALAH! Periksa kembali", "gagal");
        return;
    }

    // Saat pertama kali absen → ikatkan HP dengan nama ini
    if(!namaTerikat){
        namaTerikat = nama;
        localStorage.setItem(KUNCI_HP, nama);
        cekIkatanHP();
    }

    // Cek lokasi: HADIR + daftar wajib kantor → harus lokasi
    const wajibLokasi = (keterangan === "Hadir") && WAJIB_KANTOR.includes(nama);
    if(wajibLokasi && !lokasiDiterima){
        tampilStatus("⏳ Menunggu lokasi kantor... coba lagi sebentar", "gagal");
        return;
    }

    // Otomatis tentukan Hadir / Terlambat berdasarkan jam
    let statusAbsen = keterangan;
    if(keterangan === "Hadir"){
        if(jamMenit >= 8*60+31 && jamMenit <= 14*60){
            statusAbsen = "Terlambat";
        }
    }

    const data = {
        nama: nama,
        jabatan: jabatan,
        tgl: tgl,
        jam: jam,
        ket: statusAbsen,
        waktu: sekarang.toISOString()
    };

    document.getElementById("btnAbsen").disabled = true;
    tampilStatus("⏳ Sedang dikirim...", "");

    db.push().set(data)
    .then(()=>{
        tampilStatus("✅ ABSEN BERHASIL TERKIRIM!", "berhasil");
    })
    .catch((err)=>{
        tampilStatus("❌ Gagal: "+err.message, "gagal");
        document.getElementById("btnAbsen").disabled = false;
    });
}

function tampilStatus(pesan, jenis){
    const el = document.getElementById("status");
    el.textContent = pesan;
    el.className = "status " + jenis;
}

// === SAAT HALAMAN DIBUKA ===
cekIkatanHP();
</script>
</body>
</html>
